# Ambiente local do Kore (Setup & Ambiente). Portas do Postgres e do Redis fora
# do padrão para não conflitar com outro projeto na máquina (decisão 129).
name: kore

services:
  postgres:
    image: postgres:16-alpine
    container_name: kore-postgres
    environment:
      POSTGRES_USER: kore
      POSTGRES_PASSWORD: kore
      POSTGRES_DB: kore
    ports:
      - '5433:5432'
    volumes:
      - kore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kore -d kore']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kore-redis
    ports:
      - '6380:6379'
    volumes:
      - kore-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Emulador de S3 só no local; homologação e produção usam o R2 (ADR do MinIO).
  # O plano grátis da Chainguard só publica a tag latest: o digest fixa a versão
  # (MinIO RELEASE.2026-10-23T20-06-51Z).
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    container_name: kore-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: kore
      MINIO_ROOT_PASSWORD: kore-minio-local
      # CORS do PUT pré-assinado (Imagens do site): o MinIO não tem CORS por
      # bucket, então a origem do app fica no servidor. No R2, é regra do bucket.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - kore-minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: kore-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  kore-postgres-data:
    name: kore-postgres-data
  kore-redis-data:
    name: kore-redis-data
  kore-minio-data:
    name: kore-minio-data
